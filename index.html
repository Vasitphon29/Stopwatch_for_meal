<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport Tachometer 0-9000 RPM</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลดฟอนต์สไตล์สปอร์ตและตัวเลขดิจิทัล -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Exo 2', sans-serif;
            background-color: #090a0f;
            background-image: radial-gradient(circle at 50% 30%, #1a1d29 0%, #090a0f 75%);
            color: #ffffff;
            user-select: none;
        }

        .font-digital {
            font-family: 'Exo 2', sans-serif;
        }

        /* ตกแต่งขอบหน้าปัดโลหะและเงาสะท้อน */
        .gauge-bezel {
            background: conic-gradient(
                from 135deg,
                #2a2d3d 0%,
                #525870 15%,
                #181a24 35%,
                #3c4154 50%,
                #14161f 75%,
                #474d63 90%,
                #2a2d3d 100%
            );
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.9),
                0 0 30px rgba(0, 210, 255, 0.1),
                inset 0 2px 4px rgba(255, 255, 255, 0.3);
        }

        .gauge-face {
            background: radial-gradient(circle at 50% 45%, #161922 0%, #0a0b10 80%, #050608 100%);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.95);
        }

        /* เอฟเฟกต์แสงเรืองรองของเข็ม */
        .needle-glow {
            filter: drop-shadow(0 0 8px rgba(255, 42, 42, 0.85));
        }

        /* ปรับแต่ง Range Slider สไตล์สปอร์ต */
        input[type="range"].sport-slider {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"].sport-slider::-webkit-slider-runnable-track {
            height: 12px;
            border-radius: 999px;
            background: linear-gradient(90deg, #00d2ff 0%, #00d2ff 66.6%, #ff2a2a 77.7%, #ff0000 100%);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
        }

        input[type="range"].sport-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 28px;
            width: 28px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff, #cbd5e1);
            border: 3px solid #0f172a;
            margin-top: -9px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 4px 6px rgba(0,0,0,0.6);
            transition: transform 0.1s ease;
        }

        input[type="range"].sport-slider::-webkit-slider-thumb:hover {
            transform: scale(1.12);
        }

        input[type="range"].sport-slider::-webkit-slider-thumb:active {
            transform: scale(0.95);
            background: #ff3b3b;
        }

        /* แอนิเมชันไฟเตือน Redline */
        @keyframes pulseRedline {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 20px #ff1e1e; }
            50% { opacity: 0.3; transform: scale(0.95); box-shadow: 0 0 5px #ff1e1e; }
        }
        .redline-flash {
            animation: pulseRedline 0.18s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

    <!-- ส่วนหัวข้อ -->
    <div class="text-center mb-4 sm:mb-6">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700/80 text-xs tracking-widest text-cyan-400 uppercase mb-2">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
            Telemetry System Active
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-wider uppercase text-white">
            Sport <span class="text-red-500">Tachometer</span>
        </h1>
        <p class="text-slate-400 text-xs sm:text-sm mt-1">
            ช่วงวัด 0 - 9,000 RPM | มุมกวาด 270° (เริ่มต้น 6 นาฬิกา หมุนตามเข็มนาฬิกา)
        </p>
    </div>

    <!-- ตัวเรือนมาตรวัด (Gauge Container) -->
    <div class="relative w-full max-w-[400px] sm:max-w-[440px] aspect-square rounded-full p-3.5 sm:p-4 gauge-bezel flex items-center justify-center">
        
        <!-- ไฟ Shift Light เตือนเปลี่ยนเกียร์เมื่อเข้า Redline -->
        <div id="shiftLight" class="absolute -top-3 z-30 flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-900 border border-slate-700 shadow-lg transition-all duration-150">
            <span id="shiftDot1" class="w-2.5 h-2.5 rounded-full bg-slate-700 transition-colors"></span>
            <span id="shiftDot2" class="w-2.5 h-2.5 rounded-full bg-slate-700 transition-colors"></span>
            <span id="shiftText" class="text-[10px] font-bold tracking-widest text-slate-500 uppercase px-1">SHIFT</span>
            <span id="shiftDot3" class="w-2.5 h-2.5 rounded-full bg-slate-700 transition-colors"></span>
            <span id="shiftDot4" class="w-2.5 h-2.5 rounded-full bg-slate-700 transition-colors"></span>
        </div>

        <!-- พื้นหน้าปัดด้านใน -->
        <div class="relative w-full h-full rounded-full gauge-face overflow-hidden flex items-center justify-center border border-slate-800">
            
            <!-- SVG สำหรับวาดสเกล ตัวเลข แถบสี และเข็ม -->
            <svg id="tachometerSvg" viewBox="0 0 400 400" class="w-full h-full">
                <defs>
                    <!-- ไล่ระดับสีแถบวิ่งตามเข็ม (Dynamic Arc) -->
                    <linearGradient id="activeArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00d2ff" />
                        <stop offset="55%" stop-color="#3b82f6" />
                        <stop offset="75%" stop-color="#ff5500" />
                        <stop offset="100%" stop-color="#ff1a1a" />
                    </linearGradient>

                    <!-- เงาเรืองแสงสำหรับสเกล Redline (ใช้ userSpaceOnUse เพื่อไม่ให้เส้นแนวนอนที่ 360° หายไป) -->
                    <filter id="redGlow" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>

                    <!-- ไล่ระดับสีฝาครอบแกนเข็มตรงกลาง -->
                    <radialGradient id="capGrad" cx="40%" cy="35%" r="65%">
                        <stop offset="0%" stop-color="#475569" />
                        <stop offset="50%" stop-color="#1e293b" />
                        <stop offset="100%" stop-color="#090d16" />
                    </radialGradient>
                </defs>

                <!-- วงแหวนตกแต่งพื้นหลังด้านใน -->
                <circle cx="200" cy="200" r="184" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
                <circle cx="200" cy="200" r="118" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6" />

                <!-- แถบโค้งพื้นหลังสเกล (270 องศา) -->
                <path id="trackArc" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="butt" />

                <!-- แถบโค้งโซน Redline พื้นหลัง (7000 - 9000 RPM) -->
                <path id="redlineZoneArc" fill="none" stroke="rgba(239, 68, 68, 0.25)" stroke-width="16" stroke-linecap="butt" />

                <!-- แถบโค้งเรืองแสงที่วิ่งตามค่า RPM ปัจจุบัน -->
                <path id="progressArc" fill="none" stroke="url(#activeArcGrad)" stroke-width="8" stroke-linecap="butt" opacity="0.85" />

                <!-- กลุ่มสำหรับสร้างขีดสเกลและตัวเลขด้วย JavaScript -->
                <g id="ticksGroup"></g>
                <g id="numbersGroup"></g>

                <!-- ข้อความกำกับหน่วยบนหน้าปัด (อยู่มุมขวาล่างซึ่งเป็นพื้นที่ว่าง 90 องศา) -->
                <g transform="translate(275, 275)">
                    <text x="0" y="0" text-anchor="middle" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">x1000</text>
                    <text x="0" y="15" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="2">RPM</text>
                </g>

                <!-- จอแสดงผลดิจิทัลด้านล่างเยื้องขวา (ตำแหน่ง 4-5 นาฬิกา เพื่อไม่บังเลข 0 ที่ 6 นาฬิกา) -->
                <g transform="translate(200, 200)">
                    <!-- กรอบจอ LCD/OLED -->
                    <rect x="24" y="34" width="96" height="44" rx="8" fill="#07090e" stroke="#334155" stroke-width="1.5" />
                    <text x="72" y="47" text-anchor="middle" fill="#64748b" font-size="8" font-weight="600" letter-spacing="1.5">DIGITAL RPM</text>
                    <text id="digitalRpmText" x="72" y="69" text-anchor="middle" fill="#00d2ff" font-family="Exo 2, sans-serif" font-size="20" font-weight="700" letter-spacing="1">0</text>
                </g>

                <!-- กลุ่มเข็มมาตรวัด (หมุนรอบจุดศูนย์กลาง 200, 200) -->
                <!-- หมายเหตุ: วาดเข็มเริ่มต้นชี้ลงล่าง (6 นาฬิกา / 0 RPM) เมื่อ rotate(0) จะชี้ลงล่างพอดี -->
                <g id="needleGroup" transform="translate(200, 200) rotate(0)" class="needle-glow">
                    <!-- หางเข็ม (Counterweight) ชี้ขึ้นด้านบนเล็กน้อย -->
                    <polygon points="-5,0 5,0 3,-36 -3,-36" fill="#334155" />
                    <!-- ตัวเข็มหลักชี้ลงล่าง (ทิศ 6 นาฬิกา) ยาว 152px -->
                    <polygon points="-4.5,0 4.5,0 1.2,152 -1.2,152" fill="#ff2a2a" />
                    <!-- เส้นแกนสว่างกลางเข็ม -->
                    <line x1="0" y1="10" x2="0" y2="148" stroke="#ffffff" stroke-width="1.2" opacity="0.85" />
                </g>

                <!-- ฝาครอบแกนกลางเข็ม (Center Cap) -->
                <circle cx="200" cy="200" r="24" fill="url(#capGrad)" stroke="#475569" stroke-width="2" />
                <circle cx="200" cy="200" r="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
                <circle cx="200" cy="200" r="4" fill="#ef4444" />
            </svg>

            <!-- เงาสะท้อนกระจกหน้าปัด (Glass Glare) -->
            <div class="absolute inset-0 rounded-full pointer-events-none bg-gradient-to-tr from-transparent via-white/[0.03] to-white/[0.08]"></div>
        </div>
    </div>

    <!-- แผงควบคุมด้านล่าง (Controls Panel) -->
    <div class="w-full max-w-[440px] mt-6 bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-2xl p-5 shadow-2xl">
        
        <!-- แถบแสดงค่าสถานะและมุมองศาปัจจุบัน -->
        <div class="flex items-center justify-between mb-3">
            <div>
                <span class="text-xs text-slate-400 block">รอบเครื่องยนต์ (Engine Speed)</span>
                <div class="flex items-baseline gap-1.5">
                    <span id="readoutRpm" class="font-digital text-2xl sm:text-3xl font-bold text-cyan-400">0</span>
                    <span class="text-xs font-semibold text-slate-400">RPM</span>
                </div>
            </div>
            <div class="text-right">
                <span class="text-xs text-slate-400 block">มุมการหมุนเข็ม</span>
                <div class="flex items-baseline justify-end gap-1">
                    <span id="readoutAngle" class="font-digital text-lg sm:text-xl font-bold text-slate-200">0.0</span>
                    <span class="text-xs text-slate-400">องศา (CW)</span>
                </div>
            </div>
        </div>

        <!-- แถบเลื่อน Slider ควบคุม 0 - 9000 RPM -->
        <div class="my-4">
            <input 
                type="range" 
                id="rpmSlider" 
                min="0" 
                max="9000" 
                step="10" 
                value="0" 
                class="w-full sport-slider"
                aria-label="ปรับรอบเครื่องยนต์ 0 ถึง 9000 RPM"
            >
            <div class="flex justify-between text-[11px] font-digital text-slate-500 mt-1.5 px-1">
                <span>0</span>
                <span>3000 (90°)</span>
                <span>6000 (180°)</span>
                <span class="text-red-500 font-bold">9000 (270°)</span>
            </div>
        </div>

        <!-- ปุ่มควบคุมด่วนและโหมดทดสอบเร่งเครื่องอัตโนมัติ -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4">
            <button id="btnIdle" class="px-3 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-semibold text-slate-200 border border-slate-700 transition">
                เดินเบา (850)
            </button>
            <button id="btn3k" class="px-3 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-semibold text-cyan-300 border border-slate-700 transition">
                3,000 RPM
            </button>
            <button id="btn6k" class="px-3 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-semibold text-amber-300 border border-slate-700 transition">
                6,000 RPM
            </button>
            <button id="btnAutoRev" class="px-3 py-2.5 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 active:scale-95 text-xs font-bold text-white shadow-lg shadow-red-600/30 transition flex items-center justify-center gap-1.5">
                <span id="autoRevIcon">▶</span>
                <span id="autoRevLabel">เร่งเครื่อง</span>
            </button>
        </div>
    </div>

    <script>
        /**
         * การคำนวณพิกัดและมุมองศาของมาตรวัดรอบ:
         * - จุดศูนย์กลาง SVG: (200, 200)
         * - เลข 0 อยู่ด้านล่างสุด (ตำแหน่ง 6 นาฬิกา)
         *   -> ในระบบพิกัด SVG (0° = 3 นาฬิกา, 90° = 6 นาฬิกา, 180° = 9 นาฬิกา, 270° = 12 นาฬิกา)
         *   -> ดังนั้น เลข 0 เริ่มต้นที่มุม 90° ของวงกลม SVG
         * - หมุนตามเข็มนาฬิกา (Clockwise) เพิ่มมุมทีละ 30° ต่อ 1,000 RPM (หรือ 90° ต่อ 3,000 RPM):
         *   - 0 RPM -> 0° การหมุน (ตำแหน่ง 90° บนวงกลม = 6 นาฬิกา / ด้านล่างสุด)
         *   - 3000 RPM -> 90° การหมุน (ตำแหน่ง 180° บนวงกลม = 9 นาฬิกา / ซ้ายสุด)
         *   - 6000 RPM -> 180° การหมุน (ตำแหน่ง 270° บนวงกลม = 12 นาฬิกา / บนสุด)
         *   - 9000 RPM -> 270° การหมุน (ตำแหน่ง 360°/0° บนวงกลม = 3 นาฬิกา / ขวาสุด)
         */

        const CX = 200;
        const CY = 200;
        const START_SVG_ANGLE = 90; // 6 นาฬิกา (ด้านล่างสุด)
        const TOTAL_SWEEP = 270;    // กวาดตามเข็มนาฬิกา 270 องศา
        const MAX_RPM = 9000;
        const REV_LIMIT_RPM = 7000; // รอบตัดที่ 7,000 RPM

        // อ้างอิง DOM Elements
        const ticksGroup = document.getElementById('ticksGroup');
        const numbersGroup = document.getElementById('numbersGroup');
        const needleGroup = document.getElementById('needleGroup');
        const trackArc = document.getElementById('trackArc');
        const redlineZoneArc = document.getElementById('redlineZoneArc');
        const progressArc = document.getElementById('progressArc');
        
        const rpmSlider = document.getElementById('rpmSlider');
        const digitalRpmText = document.getElementById('digitalRpmText');
        const readoutRpm = document.getElementById('readoutRpm');
        const readoutAngle = document.getElementById('readoutAngle');
        
        const shiftLight = document.getElementById('shiftLight');
        const shiftText = document.getElementById('shiftText');
        const shiftDots = [
            document.getElementById('shiftDot1'),
            document.getElementById('shiftDot2'),
            document.getElementById('shiftDot3'),
            document.getElementById('shiftDot4')
        ];

        const btnIdle = document.getElementById('btnIdle');
        const btn3k = document.getElementById('btn3k');
        const btn6k = document.getElementById('btn6k');
        const btnAutoRev = document.getElementById('btnAutoRev');
        const autoRevIcon = document.getElementById('autoRevIcon');
        const autoRevLabel = document.getElementById('autoRevLabel');

        // ฟังก์ชันแปลงพิกัดเชิงขั้ว (Polar) เป็นพิกัดฉาก (Cartesian)
        function polarToCartesian(cx, cy, radius, angleInDegrees) {
            const angleInRadians = (angleInDegrees * Math.PI) / 180.0;
            return {
                x: cx + radius * Math.cos(angleInRadians),
                y: cy + radius * Math.sin(angleInRadians)
            };
        }

        // ฟังก์ชันสร้าง SVG Path สำหรับส่วนโค้ง (Arc) ตามเข็มนาฬิกา
        function describeArc(cx, cy, radius, startAngle, endAngle) {
            const start = polarToCartesian(cx, cy, radius, startAngle);
            const end = polarToCartesian(cx, cy, radius, endAngle);
            const sweepAngle = endAngle - startAngle;
            const largeArcFlag = sweepAngle <= 180 ? "0" : "1";
            // sweepFlag = 1 หมายถึงวาดตามเข็มนาฬิกา
            return [
                "M", start.x, start.y,
                "A", radius, radius, 0, largeArcFlag, 1, end.x, end.y
            ].join(" ");
        }

        // สร้างสเกลหน้าปัดทั้งหมด (ขีดหลัก ขีดย่อย และตัวเลข 0 - 9)
        function initGaugeDial() {
            // 1. วาดแถบโค้งพื้นหลัง 0 - 9000 RPM (90° ถึง 360°)
            trackArc.setAttribute('d', describeArc(CX, CY, 168, START_SVG_ANGLE, START_SVG_ANGLE + TOTAL_SWEEP));

            // 2. วาดแถบโค้งโซน Redline / รอบตัด 7000 - 9000 RPM (300° ถึง 360°)
            const redlineStartAngle = START_SVG_ANGLE + (REV_LIMIT_RPM / MAX_RPM) * TOTAL_SWEEP;
            redlineZoneArc.setAttribute('d', describeArc(CX, CY, 168, redlineStartAngle, START_SVG_ANGLE + TOTAL_SWEEP));

            // 3. วาดขีดสเกลย่อยทุกๆ 200 RPM (รวม 45 ช่อง)
            const totalSubSteps = 45; // 9000 / 200 = 45
            for (let i = 0; i <= totalSubSteps; i++) {
                const currentRpm = i * 200;
                const progress = currentRpm / MAX_RPM;
                const svgAngle = START_SVG_ANGLE + progress * TOTAL_SWEEP;
                
                const isMajor = (i % 5 === 0);     // ทุกๆ 1000 RPM (เลข 0-9)
                const isRedline = (currentRpm >= REV_LIMIT_RPM);

                const outerR = 150;
                const innerR = isMajor ? 130 : 135;
                
                const p1 = polarToCartesian(CX, CY, outerR, svgAngle);
                const p2 = polarToCartesian(CX, CY, innerR, svgAngle);

                const tick = document.createElementNS("http://www.w3.org/2000/svg", "line");
                tick.setAttribute("x1", p1.x);
                tick.setAttribute("y1", p1.y);
                tick.setAttribute("x2", p2.x);
                tick.setAttribute("y2", p2.y);

                if (isMajor) {
                    tick.setAttribute("stroke", isRedline ? "#ff2a2a" : "#ffffff");
                    tick.setAttribute("stroke-width", "3.5");
                    tick.setAttribute("stroke-linecap", "round");
                    if (isRedline) tick.setAttribute("filter", "url(#redGlow)");
                } else {
                    tick.setAttribute("stroke", isRedline ? "#ef4444" : "#64748b");
                    tick.setAttribute("stroke-width", "1.5");
                }

                ticksGroup.appendChild(tick);

                // 4. วาดตัวเลข 0 ถึง 9 สำหรับขีดหลัก
                if (isMajor) {
                    const numValue = currentRpm / 1000;
                    const textRadius = 132;
                    const textPos = polarToCartesian(CX, CY, textRadius, svgAngle);

                    const textEl = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    textEl.setAttribute("x", textPos.x);
                    textEl.setAttribute("y", textPos.y);
                    textEl.setAttribute("text-anchor", "middle");
                    textEl.setAttribute("dominant-baseline", "central");
                    textEl.setAttribute("font-family", "Exo 2, sans-serif");
                    textEl.setAttribute("font-weight", "500");
                    
                    // เน้นขนาดตัวเลขหลัก 0, 3, 6, 9 ให้เด่นชัดขึ้นเล็กน้อย
                    const isCardinal = (numValue % 3 === 0);
                    textEl.setAttribute("font-size", isCardinal ? "30" : "30");
                    textEl.setAttribute("fill", isRedline ? "#ff3b3b" : (isCardinal ? "#ffffff" : "#cbd5e1"));
                    
                    if (isRedline) {
                        textEl.setAttribute("filter", "url(#redGlow)");
                    }

                    textEl.textContent = numValue;
                    numbersGroup.appendChild(textEl);
                }
            }
        }

        // ตัวแปรจัดการแอนิเมชันที่ลื่นไหล
        let targetRpm = 0;
        let currentDisplayRpm = 0;
        let isAutoRevving = false;
        let autoRevPhase = 0;
        let lastTimestamp = 0;

        // ฟังก์ชันอัปเดตการแสดงผลของเข็มและตัวเลขทั้งหมด
        function renderGauge(rpm) {
            // จำกัดขอบเขต 0 - 9000
            const clampedRpm = Math.max(0, Math.min(MAX_RPM, rpm));
            
            // คำนวณมุมการหมุนตามเข็มนาฬิกา (0 ถึง 270 องศา)
            const rotationDeg = (clampedRpm / MAX_RPM) * TOTAL_SWEEP;
            
            // หมุนเข็ม (เข็มถูกวาดเริ่มต้นชี้ลง 6 นาฬิกา ดังนั้น rotate(rotationDeg) จะหมุนตามเข็มนาฬิกาตรงเป๊ะ)
            needleGroup.setAttribute("transform", `translate(${CX}, ${CY}) rotate(${rotationDeg})`);

            // อัปเดตแถบแสงโค้งที่วิ่งตามเข็ม
            if (rotationDeg > 0.5) {
                progressArc.setAttribute("d", describeArc(CX, CY, 168, START_SVG_ANGLE, START_SVG_ANGLE + rotationDeg));
            } else {
                progressArc.setAttribute("d", "");
            }

            // อัปเดตตัวเลขดิจิทัล
            const roundedRpm = Math.round(clampedRpm);
            digitalRpmText.textContent = roundedRpm;
            readoutRpm.textContent = roundedRpm.toLocaleString();
            readoutAngle.textContent = rotationDeg.toFixed(1);

            // เปลี่ยนสีตัวเลขตามโซนรอบเครื่อง
            if (roundedRpm >= REV_LIMIT_RPM) {
                digitalRpmText.setAttribute("fill", "#ff2a2a");
                readoutRpm.className = "font-digital text-2xl sm:text-3xl font-bold text-red-500";
            } else if (roundedRpm >= 5000) {
                digitalRpmText.setAttribute("fill", "#f59e0b");
                readoutRpm.className = "font-digital text-2xl sm:text-3xl font-bold text-amber-400";
            } else {
                digitalRpmText.setAttribute("fill", "#00d2ff");
                readoutRpm.className = "font-digital text-2xl sm:text-3xl font-bold text-cyan-400";
            }

            // จัดการไฟ Shift Light เตือนเมื่อเข้าใกล้และอยู่ในโซนรอบตัด (7,000+ RPM)
            updateShiftLight(roundedRpm);
        }

        // อัปเดตไฟ Shift Light ด้านบนหน้าปัด
        function updateShiftLight(rpm) {
            // ระดับไฟติดทีละดวงตั้งแต่ 5500 -> 6000 -> 6500 -> 7000 (รอบตัด)
            shiftDots[0].style.backgroundColor = rpm >= 5500 ? "#22c55e" : "#334155";
            shiftDots[1].style.backgroundColor = rpm >= 6000 ? "#eab308" : "#334155";
            shiftDots[2].style.backgroundColor = rpm >= 6500 ? "#f97316" : "#334155";
            shiftDots[3].style.backgroundColor = rpm >= REV_LIMIT_RPM ? "#ef4444" : "#334155";

            if (rpm >= REV_LIMIT_RPM) {
                shiftLight.classList.add("redline-flash", "border-red-500", "bg-red-950/90");
                shiftText.classList.remove("text-slate-500");
                shiftText.classList.add("text-red-400");
                shiftText.textContent = "LIMIT";
                shiftDots.forEach(d => d.style.backgroundColor = "#ff1e1e");
            } else {
                shiftLight.classList.remove("redline-flash", "border-red-500", "bg-red-950/90");
                shiftText.classList.add("text-slate-500");
                shiftText.classList.remove("text-red-400");
                shiftText.textContent = "SHIFT";
            }
        }

        // ลูปแอนิเมชันหลัก (Animation Loop) เพื่อให้เข็มเคลื่อนที่นุ่มนวลเหมือนเข็มจริงมีแรงเฉื่อย
        function animationLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const dt = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            // หากเปิดโหมดเร่งเครื่องอัตโนมัติ (Auto Revving Simulation) โดยตั้งรอบตัดไว้ที่ 7,000 RPM
            if (isAutoRevving) {
                autoRevPhase += dt;
                // จำลองการเร่งเครื่องสับเกียร์ 1 -> 2 -> 3 -> ตัดรอบที่ 7,000 RPM
                const cycle = autoRevPhase % 6.5;
                if (cycle < 1.8) {
                    // เกียร์ 1: เร่งจาก 1000 ไปชนรอบตัด 7000
                    targetRpm = 1000 + (cycle / 1.8) * 6000;
                } else if (cycle < 3.4) {
                    // เกียร์ 2: สับเกียร์ตกลงมาที่ 4200 แล้วลากไปชนรอบตัด 7000
                    const sub = (cycle - 1.8) / 1.6;
                    targetRpm = 4200 + sub * 2800;
                } else if (cycle < 5.2) {
                    // เกียร์ 3: สับเกียร์ตกลงมาที่ 4800 แล้วลากไปติดรอบตัดที่ 7,000 RPM
                    const sub = (cycle - 3.4) / 1.8;
                    const rawRpm = 4800 + sub * 2800;
                    // เมื่อถึง 7,000 RPM ให้เกิดอาการรอบตัดเด้งกลับ (Rev Limiter Bounce) ระหว่าง 6,850 - 7,050 RPM
                    if (rawRpm >= REV_LIMIT_RPM) {
                        targetRpm = (REV_LIMIT_RPM - 50) + Math.sin(timestamp * 0.085) * 120;
                    } else {
                        targetRpm = rawRpm;
                    }
                } else {
                    // ถอนคันเร่งกลับสู่รอบเดินเบา
                    const sub = (cycle - 5.2) / 1.3;
                    targetRpm = REV_LIMIT_RPM * (1 - sub) + 850 * sub;
                }
                rpmSlider.value = Math.round(targetRpm);
            }

            // ระบบหน่วงแรงเฉื่อย (Spring/Damping Interpolation) ให้เข็มขยับสมจริง
            const lerpSpeed = isAutoRevving ? 18 : 22;
            const diff = targetRpm - currentDisplayRpm;
            if (Math.abs(diff) > 0.5) {
                currentDisplayRpm += diff * Math.min(1, dt * lerpSpeed);
            } else {
                currentDisplayRpm = targetRpm;
            }

            renderGauge(currentDisplayRpm);
            requestAnimationFrame(animationLoop);
        }

        // ฟังก์ชันเปิด/ปิดโหมดเร่งเครื่องอัตโนมัติ
        function toggleAutoRev(forceState) {
            isAutoRevving = typeof forceState === 'boolean' ? forceState : !isAutoRevving;
            if (isAutoRevving) {
                autoRevPhase = 0;
                autoRevIcon.textContent = "■";
                autoRevLabel.textContent = "หยุดทดสอบ";
                btnAutoRev.classList.replace("from-red-600", "from-amber-600");
                btnAutoRev.classList.replace("to-rose-600", "to-orange-600");
            } else {
                autoRevIcon.textContent = "▶";
                autoRevLabel.textContent = "เร่งเครื่อง";
                btnAutoRev.classList.replace("from-amber-600", "from-red-600");
                btnAutoRev.classList.replace("to-orange-600", "to-rose-600");
            }
        }

        // Event Listeners สำหรับการควบคุม
        rpmSlider.addEventListener('input', (e) => {
            if (isAutoRevving) toggleAutoRev(false);
            targetRpm = parseFloat(e.target.value);
        });

        btnIdle.addEventListener('click', () => {
            toggleAutoRev(false);
            targetRpm = 850;
            rpmSlider.value = 850;
        });

        btn3k.addEventListener('click', () => {
            toggleAutoRev(false);
            targetRpm = 3000;
            rpmSlider.value = 3000;
        });

        btn6k.addEventListener('click', () => {
            toggleAutoRev(false);
            targetRpm = 6000;
            rpmSlider.value = 6000;
        });

        btnAutoRev.addEventListener('click', () => {
            toggleAutoRev();
        });

        // เริ่มต้นทำงานเมื่อโหลดหน้าเว็บเสร็จ
        window.onload = function () {
            initGaugeDial();
            renderGauge(0);
            requestAnimationFrame(animationLoop);
        };
    </script>
</body>
</html>
